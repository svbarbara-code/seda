 ['Março',[['era','Ingressos do show de acrobatas ERA (ter 13 abr)',''],['cha','Cerimônia do chá (seg 12 abr), 2 a 3 semanas antes',''],['mesas','Mesas: Above & Beyond (sex 16) e pato no Dadong (qua 7)',''],['trem1','Por volta de 25 mar: trem G365 Pequim → Xi\'an, 1ª classe','Esgota rápido. Se não houver 1ª classe: classe executiva.'],['muralha','Muralha de Mutianyu: entrada, ônibus e teleférico','Entre 15 e 30 dias antes.'],['proibida','Qua 31 mar, 09:00 (horário de Brasília): Cidade Proibida','Com os três passaportes, horário da manhã. Esgota.'],['trem2','A partir de 31 mar: trem G5647 Shenzhen → Hong Kong',''],['terracota','Antes de viajar: pré-reserva do Exército de Terracota no Trip.com','']]]

const PACK = [['docs','Passaportes (os mesmos usados nas reservas)'],['febre','Certificado internacional de febre amarela'],['vistos','Vistos, se forem exigidos'],['esim','eSIM instalado nos três celulares (China + Hong Kong)'],['alipay','Alipay configurado com cartão, antes de sair'],['mapas','Mapas offline e este app salvos no celular'],['roupa','Roupa em camadas: Pequim tem manhã de 7 °C, Shenzhen chega a 29 °C'],['chuva','Capa de chuva leve (Xangai e Hong Kong)'],['sapato','Sapato confortável, já amaciado'],['lanche','Lanchinhos leves para os dias de viagem'],['remedios','Remédios de uso pessoal, na bagagem de mão'],['adaptador','Adaptador de tomada e carregador portátil']];
const WX = [['Pequim','4 a 8 abr','21 / 7 °C','7%'],["Xi'an",'9 e 10 abr','26 / 13 °C','sem chuva'],['Xangai','11 a 13 abr','22 / 13 °C','50%'],['Shenzhen','14 abr','29 / 21 °C','25%'],['Hong Kong','15 a 17 abr','26 / 21 °C','58%']];
// ---------- helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const NOW_OFF = (() => { const q = new URLSearchParams(location.search).get('now'); const t = q ? Date.parse(q) : NaN; return isNaN(t) ? 0 : t - Date.now(); })();
const nowD = () => new Date(Date.now() + NOW_OFF);
function inTZ(d){ const p = Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(d).map(x=>[x.type,x.value])); return {iso:`${p.year}-${p.month}-${p.day}`, hm:`${p.hour==='24'?'00':p.hour}:${p.minute}`}; }
const store = { get(k,d){ try{ const v = localStorage.getItem('seda:'+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem('seda:'+k, JSON.stringify(v)); }catch(e){} } };
const LABEL = {easy:'dia leve', heavy:'dia mais puxado', move:'dia de viagem'};
const fmtDate = iso => { const [y,m,d] = iso.split('-').map(Number); return `${d} de ${['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'][m-1]}`; };
function dayCard(d, nowHm){
  let cur = -1; if (nowHm) d.ev.forEach((e,i) => { if (/^\d\d:\d\d$/.test(e[0]) && e[0] <= nowHm) cur = i; });
  return `<div class="card" id="day-${d.iso}"><div class="eyebrow">${d.wd} · ${fmtDate(d.iso)} · ${esc(CITY[d.c])}</div><div class="big">${esc(d.t)}</div>
  <div class="tags">${d.k.map(k=>`<span class="tag ${k}">${LABEL[k]}</span>`).join('')}${d.km?`<span class="tag">a pé: ${esc(d.km)}</span>`:''}</div>
  <ul class="tl">${d.ev.map((e,i)=>`<li class="${i===cur?'now':''}"><span class="t">${esc(e[0])}</span><span>${esc(e[1])}</span></li>`).join('')}</ul>${d.n?`<div class="note">${esc(d.n)}</div>`:''}</div>`;
}
function checklist(group, items){ const st = store.get('ck', {}); return items.map(([id,txt,sub]) => { const k = group+':'+id, on = !!st[k]; return `<label class="ck ${on?'done':''}"><input type="checkbox" data-k="${k}" ${on?'checked':''}><span>${esc(txt)}${sub?`<small>${esc(sub)}</small>`:''}</span></label>`; }).join(''); }
function say(text, lang){ try{ if (!('speechSynthesis' in window)) return; speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = lang; u.rate = .8; const v = speechSynthesis.getVoices().find(x => x.lang && x.lang.replace('_','-').toLowerCase().startsWith(lang.toLowerCase())); if (v) u.voice = v; speechSynthesis.speak(u); }catch(e){} }
function showCard(title, zh, pt){ $('#dlg-t').textContent = title; $('#dlg-zh').textContent = zh; $('#dlg-pt').textContent = pt; const d = $('#dlg'); if (d.showModal) d.showModal(); else d.setAttribute('open',''); }
const tbl = (head, rows) => `<div class="x"><table><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table></div>`;
// ---------- views ----------
function vHoje(){
  const n = nowD(), here = inTZ(n), d = DAYS.find(x => x.iso === here.iso);
  let h = '';
  if (d) {
    const i = DAYS.indexOf(d), next = DAYS[i+1];
    h += `<div class="card hero"><div class="eyebrow">Agora na China · ${here.hm}</div>`;
    const upcoming = d.ev.find(e => /^\d\d:\d\d$/.test(e[0]) && e[0] > here.hm);
    h += upcoming ? `<div class="big">A seguir, às ${upcoming[0]}</div><p>${esc(upcoming[1])}</p>` : `<div class="big">O dia terminou</div><p>Descansem. ${next ? 'Amanhã: ' + esc(next.t) + '.' : ''}</p>`;
    h += `</div>` + dayCard(d, here.hm);
    if (next) h += `<h2>Amanhã</h2>` + dayCard(next);
  } else if (here.iso < DAYS[0].iso) {
    const days = Math.ceil((Date.parse(DAYS[0].iso+'T00:00:00+08:00') - n.getTime()) / 864e5);
    h += `<div class="card hero"><div class="eyebrow">Contagem regressiva</div><div class="count">${days}</div><p>${days===1?'dia':'dias'} até a saída do Brasil, na noite de sexta, 2 de abril de 2027.</p></div>`;
    h += `<div class="card"><div class="eyebrow">A viagem</div><div class="big">Pequim → Xi'an → Xangai → Shenzhen → Hong Kong</div><p class="mute">13 noites, 5 hotéis. Bárbara, papai e mamãe, os três juntos do começo ao fim.</p>${tbl(['Cidade','Noites','Datas'], NIGHTS.map(r=>[r[0],r[1],r[2]]))}</div>`;
    const st = store.get('ck', {}), nextTodo = TODO.flatMap(g => g[1].map(i => ['todo:'+i[0], i[1], g[0]])).filter(x => !st[x[0]]).slice(0,3);
    if (nextTodo.length) h += `<div class="card"><div class="eyebrow">Próximos passos</div><ul class="tl">${nextTodo.map(x=>`<li><span class="t">${esc(x[2])}</span><span>${esc(x[1])}</span></li>`).join('')}</ul><p class="note">A lista completa está em Prático.</p></div>`;
    h += `<h2>Primeiro dia</h2>` + dayCard(DAYS[2]);
  } else {
    h += `<div class="card hero"><div class="eyebrow">Viagem concluída</div><div class="big">Bem-vindos de volta</div><p>Os dias continuam aqui, na aba Dias, para lembrar.</p></div>`;
  }
  $('#v-hoje').innerHTML = h;
}
function vDias(){
  const cities = [['all','Todos'],['bj','Pequim'],['xa',"Xi'an"],['sh','Xangai'],['sz','Shenzhen'],['hk','Hong Kong']], sel = store.get('city','all');
  const list = DAYS.filter(d => sel==='all' || d.c===sel);
  $('#v-dias').innerHTML = `<div class="chips">${cities.map(c=>`<button class="chip ${c[0]===sel?'on':''}" data-city="${c[0]}">${c[1]}</button>`).join('')}</div><p class="mute">As distâncias a pé são estimativas. Horários no fuso da China.</p>` + list.map(d=>dayCard(d)).join('');
}
function vViagem(){
  $('#v-viagem').innerHTML = `<h2>Voos internacionais</h2><p class="mute">Emirates, em duas reservas separadas. Ainda não comprados.</p>
  <div class="card"><h3>Bárbara · de São Paulo</h3>${tbl(['Voo','Trecho','Data','Horário'], FLY_B)}</div>
  <div class="card"><h3>Papai e mamãe · do Rio</h3>${tbl(['Voo','Trecho','Data','Horário'], FLY_P)}</div>
  <div class="card"><div class="eyebrow">Atenção às datas</div><p>Os dois voos de ida saem na madrugada de sábado, 3 de abril: a ida ao aeroporto é na noite de sexta.</p><p>O voo de volta sai às 00:05 de domingo, 18 de abril: a ida ao aeroporto é na noite de sábado, 17.</p><p>Os três se encontram em Dubai e seguem juntos para Pequim. Na volta, voam juntos de Hong Kong a Dubai e se separam lá.</p></div>
  <h2>Dentro da China</h2><div class="card">${tbl(['Dia','Trecho','Como','Horário','Obs.'], LEGS)}<p class="note">Estação de trem: chegar 45 a 60 min antes, com o passaporte na mão. Horários dos trens são os de hoje e precisam ser conferidos quando a venda abrir.</p></div>
  <h2>Hotéis</h2><p class="mute">Dois quartos em cada cidade. Ainda não reservados.</p>` + NIGHTS.map(r=>`<div class="card"><div class="eyebrow">${esc(r[0])} · ${esc(r[1])} · ${esc(r[2])}</div><div class="big">${esc(r[3])}</div>${r[4]?`<button class="chip" data-show="${esc(r[4])}" data-pt="${esc(r[3])}" data-t="Mostrar ao motorista">Mostrar o nome em chinês</button>`:`<p class="note">Peça na recepção o cartão do hotel com o endereço em chinês.</p>`}</div>`).join('') + `<p class="note">No último dia em Hong Kong fica só o quarto do papai e da mamãe, até 20:45.</p>`;
}
function vComer(){
  $('#v-comer').innerHTML = `<h2>Onde comer</h2><div class="card"><div class="eyebrow">Combinado</div><p>Refeições em horários regulares, sem longos intervalos. Sempre há uma opção leve, com pouca pimenta e pouco açúcar. Nada de carnes exóticas.</p><p class="note">Só três mesas serão reservadas: o pato em Pequim e as duas de Hong Kong. O resto é por ordem de chegada, com alternativa perto do hotel.</p></div>` +
  FOOD.map(([c,rows])=>`<div class="card"><div class="eyebrow">${esc(c)}</div><ul class="tl">${rows.map(r=>`<li><span class="t">${esc(r[0])}</span><span>${r[1]==='Especial'?'<b>':''}${esc(r[2])}${r[1]==='Especial'?'</b>':''}</span></li>`).join('')}</ul></div>`).join('') +
  `<h2>Pratos para pedir</h2><div class="card">${DISHES.map(p=>`<div class="ph"><div><div class="zh">${p[0]}</div><div class="py">${p[1]}</div><div>${esc(p[2])}</div></div><button class="say" data-say="${p[0]}" data-lang="zh-CN" aria-label="Ouvir">🔊</button></div>`).join('')}</div>`;
}
function vFrases(){
  $('#v-frases').innerHTML = `<h2>Frases</h2><p class="mute">Toque no alto-falante para ouvir, ou mostre a tela para a pessoa.</p>` +
  PHRASES.map(([t,lang,rows])=>`<div class="card"><div class="eyebrow">${esc(t)}</div>${rows.map(p=>`<div class="ph"><div><div class="zh">${p[0]}</div><div class="py">${p[1]}</div><div>${esc(p[2])}</div></div><button class="say" data-say="${p[0]}" data-lang="${lang}" aria-label="Ouvir">🔊</button></div>`).join('')}</div>`).join('') +
  `<h2>Para mostrar ao motorista</h2><p class="mute">Toque em um lugar para abrir o nome bem grande.</p>` +
  TAXI.map(([c,rows])=>`<div class="card"><div class="eyebrow">${esc(c)}</div><div class="tags">${rows.map(r=>`<button class="chip" data-show="${esc(r[1])}" data-pt="${esc(r[0])}" data-t="Mostrar ao motorista">${esc(r[0])}</button>`).join('')}</div></div>`).join('');
}
function vPratico(){
  $('#v-pratico').innerHTML = `<h2>O que falta fazer</h2>` + TODO.map(([g,items])=>`<div class="card"><div class="eyebrow">${esc(g)}</div>${checklist('todo', items)}</div>`).join('') +
  `<h2>Na mala</h2><div class="card">${checklist('pack', PACK.map(p=>[p[0],p[1],'']))}</div>
  <h2>Entrada na China e em Hong Kong</h2><div class="card"><p><b>China continental:</b> a isenção de visto para brasileiros vale só até 31 de dezembro de 2026. Para abril de 2027, o plano é tirar o visto de turista, a não ser que a isenção seja renovada. Decisão em 15 de janeiro.</p><p><b>Hong Kong:</b> brasileiros entram sem visto por até 90 dias.</p><p class="note">Shenzhen vem antes de Hong Kong, então é uma entrada só na China continental.</p></div>
  <h2>Dinheiro e internet</h2><div class="card"><p><b>Pagamentos:</b> na China quase tudo é pelo Alipay, com QR code. Dinheiro e cartão são pouco usados. Em Hong Kong: dólar de Hong Kong, cartão e o cartão Octopus.</p><p><b>Internet:</b> Google, WhatsApp e Instagram são bloqueados nas redes chinesas. O eSIM de viagem resolve isso. Cada um terá o seu.</p><p><b>Tomadas:</b> levar adaptador universal.</p></div>
  <h2>Clima em abril</h2><div class="card">${tbl(['Cidade','Datas','Máx. / mín.','Chuva'], WX)}</div>
  <h2>Se alguém se perder</h2><div class="card"><p>Ficar onde está e ligar ou mandar mensagem. Mostrar o cartão do hotel a um motorista de táxi: os nomes em chinês estão na aba Frases.</p><p class="note">Emergência na China: polícia 110, ambulância 120. Em Hong Kong: 999.</p></div>`;
}
// ---------- shell ----------
const TABS = [['hoje','Hoje','☀️',vHoje],['dias','Dias','🗓️',vDias],['viagem','Viagem','✈️',vViagem],['comer','Comer','🥢',vComer],['frases','Frases','💬',vFrases],['pratico','Prático','🎒',vPratico]];
function go(id){ const t = TABS.find(x => x[0]===id) || TABS[0]; t[3](); document.querySelectorAll('section.view').forEach(s => s.classList.toggle('on', s.id === 'v-'+t[0])); document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t[0])); if (location.hash !== '#'+t[0]) history.replaceState(null,'','#'+t[0]); window.scrollTo(0,0); }
$('#tabs').innerHTML = TABS.map(t => `<button data-tab="${t[0]}"><i>${t[2]}</i>${t[1]}</button>`).join('');
document.addEventListener('click', e => {
  const tab = e.target.closest('#tabs button'); if (tab) return go(tab.dataset.tab);
  const s = e.target.closest('[data-say]'); if (s) return say(s.dataset.say, s.dataset.lang);
  const sh = e.target.closest('[data-show]'); if (sh) return showCard(sh.dataset.t, sh.dataset.show, sh.dataset.pt);
  const c = e.target.closest('[data-city]'); if (c) { store.set('city', c.dataset.city); vDias(); }
});
document.addEventListener('change', e => { const k = e.target.dataset && e.target.dataset.k; if (!k) return; const st = store.get('ck', {}); st[k] = e.target.checked; store.set('ck', st); e.target.closest('label').classList.toggle('done', e.target.checked); });
if ('speechSynthesis' in window) speechSynthesis.getVoices();
go((location.hash || '#hoje').slice(1));
setInterval(() => { if ($('#v-hoje').classList.contains('on')) vHoje(); }, 60000);
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
