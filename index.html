const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const NOW_OFF = (() => { const q = new URLSearchParams(location.search).get('now'); const t = q ? Date.parse(q) : NaN; return isNaN(t) ? 0 : t - Date.now(); })();
const nowD = () => new Date(Date.now() + NOW_OFF);
function inTZ(d){ const p = Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(d).map(x=>[x.type,x.value])); return {iso:`${p.year}-${p.month}-${p.day}`, hm:`${p.hour==='24'?'00':p.hour}:${p.minute}`}; }
const store = { get(k,d){ try{ const v = localStorage.getItem('seda:'+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem('seda:'+k, JSON.stringify(v)); }catch(e){} } };
const LABEL = {easy:'dia leve', heavy:'dia mais puxado', move:'dia de viagem'};
const fmtDate = iso => { const [y,m,d] = iso.split('-').map(Number); return `${d} de ${['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'][m-1]}`; };
const ART = {bj:'pequim', xa:'xian', sh:'xangai', sz:'shenzhen', hk:'hongkong', 'Pequim':'pequim', "Xi'an":'xian', 'Xangai':'xangai', 'Shenzhen':'shenzhen', 'Hong Kong':'hongkong'};
const DAYART = {'2027-04-08':'panda', '2027-04-12':'cha'};
const img = (n, cls) => `<img class="${cls}" src="art-${n}.webp" alt="" loading="lazy">`;
const TENT = /Trem G\d+|[Vv]oos?\b|Chegada desejada/;
function evText(t, label){ return TENT.test((label||'')+' '+t) ? `${esc(t)} <span class="tag tent">provisório</span>` : esc(t); }
function dayCard(d, nowHm){
  let cur = -1; if (nowHm) d.ev.forEach((e,i) => { if (/^\d\d:\d\d$/.test(e[0]) && e[0] <= nowHm) cur = i; });
  return `<div class="card" id="day-${d.iso}">${DAYART[d.iso]?img(DAYART[d.iso],'spot'):''}<div class="eyebrow">${d.wd} · ${fmtDate(d.iso)} · ${esc(CITY[d.c])}</div><div class="big">${esc(d.t)}</div>
  <div class="tags">${d.k.map(k=>`<span class="tag ${k}">${LABEL[k]}</span>`).join('')}${d.km?`<span class="tag">a pé: ${esc(d.km)}</span>`:''}</div>
  <ul class="tl">${d.ev.map((e,i)=>`<li class="${i===cur?'now':''}"><span class="t">${esc(e[0])}</span><span>${evText(e[1], e[0])}</span></li>`).join('')}</ul>${d.n?`<div class="note">${esc(d.n)}</div>`:''}</div>`;
}
function checklist(group, items){ const st = store.get('ck', {}); return items.map(([id,txt,sub]) => { const k = group+':'+id, on = !!st[k]; return `<label class="ck ${on?'done':''}"><input type="checkbox" data-k="${k}" ${on?'checked':''}><span>${esc(txt)}${sub?`<small>${esc(sub)}</small>`:''}</span></label>`; }).join(''); }
function say(text, lang){ try{ if (!('speechSynthesis' in window)) return; speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = lang; u.rate = .8; const v = speechSynthesis.getVoices().find(x => x.lang && x.lang.replace('_','-').toLowerCase().startsWith(lang.toLowerCase())); if (v) u.voice = v; speechSynthesis.speak(u); }catch(e){} }
function openDlg(d){ if (d.showModal) d.showModal(); else d.setAttribute('open',''); }
function showCard(title, zh, pt, addr){ $('#dlg-t').textContent = title; $('#dlg-zh').textContent = zh; $('#dlg-pt').textContent = pt; $('#dlg-c1').dataset.copy = zh;
  const a = $('#dlg-addr'), c2 = $('#dlg-c2'); a.hidden = c2.hidden = !addr; a.textContent = addr || ''; c2.dataset.copy = addr || ''; openDlg($('#dlg')); }
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 1800); }
async function copyText(text){ let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {
    try { const host = document.querySelector('dialog[open]') || document.body, ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly',''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0'; host.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length); ok = document.execCommand('copy'); ta.remove(); } catch (e2) {} }

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw){ if (!SEC || SEC.startsWith('__')) return null;
  try { const raw = b64(SEC), salt = raw.slice(0,16), iv = raw.slice(16,28), ct = raw.slice(28);
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw.trim()), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:250000, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
    return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ct))); } catch (e) { return null; } }
